<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الأفلام - تجربة Netflix العربية</title>
    <!-- Font Awesome لأيقونات البحث والمفضلة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts - Cairo للخط العربي الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شريط التنقل العلوي -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">أفلامي</a>
            </div>
            <div class="search-box">
                <input type="text" id="search" placeholder="ابحث عن فيلم..." autocomplete="off">
                <i class="fas fa-search"></i>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active" data-category="popular">الرئيسية</a></li>
                <li><a href="#" data-category="top_rated">الأعلى تقييماً</a></li>
                <li><a href="#" data-category="upcoming">قريباً</a></li>
                <li><a href="#" id="favorites-link">المفضلة <span id="fav-count">0</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- واجهة البطل (Hero Section) -->
    <header class="hero" id="hero">
        <div class="hero-content">
            <h1 id="hero-title">فيلم مميز اليوم</h1>
            <p id="hero-desc">استمتع بمشاهدة أحدث الأفلام والمسلسلات بجودة عالية.</p>
            <div class="hero-btns">
                <button class="btn btn-play"><i class="fas fa-play"></i> تشغيل</button>
                <button class="btn btn-info"><i class="fas fa-info-circle"></i> المزيد من المعلومات</button>
            </div>
        </div>
    </header>

    <!-- الحاويات الرئيسية للأفلام -->
    <main class="container">
        <section class="movies-section">
            <h2 id="section-title">أفلام شائعة</h2>
            <div id="loading" class="loader"></div>
            <div id="movies-grid" class="movies-grid">
                <!-- سيتم إضافة الأفلام هنا برمجياً -->
            </div>
            <div id="error-message" class="error-message" style="display: none;">
                حدث خطأ أثناء تحميل البيانات. يرجى المحاولة مرة أخرى.
            </div>
        </section>
    </main>

    <!-- نافذة منبثقة لتفاصيل الفيلم (Modal) -->
    <div id="movie-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-poster">
                    <img id="modal-img" src="" alt="Poster">
                </div>
                <div class="modal-info">
                    <h2 id="modal-title"></h2>
                    <p id="modal-date" class="date"></p>
                    <p id="modal-rating" class="rating"></p>
                    <p id="modal-overview" class="overview"></p>
                    <div class="modal-actions">
                        <button id="trailer-btn" class="btn btn-red"><i class="fab fa-youtube"></i> عرض الإعلان</button>
                        <button id="add-fav-btn" class="btn btn-outline"><i class="far fa-heart"></i> إضافة للمفضلة</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- تذييل الصفحة -->
    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة - تصميم مستوحى من Netflix</p>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
